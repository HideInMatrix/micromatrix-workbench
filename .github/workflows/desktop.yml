name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Validate application and tag versions
        run: node scripts/check-release-version.mjs
      - run: npm run check

  build:
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are required: a cross-compiled Tauri app must not
          # accidentally embed a SEA built for the runner's different CPU.
          - runner: macos-15
            id: macos-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            id: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-2022
            id: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: ubuntu-22.04
            id: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      MICROMATRIX_BUILD_TARGET: ${{ matrix.target }}
      # Ad-hoc only; these are test packages, not notarized distribution builds.
      APPLE_SIGNING_IDENTITY: '-'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.98.1'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - run: npm ci
      - name: Native-platform regression tests
        run: npm run check
      - name: Build and smoke-test native Node SEA
        run: npm run check:sidecar
      - name: Build Tauri installers
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers, standalone service, notices and checksums
        run: node scripts/package-artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: micromatrix-${{ matrix.id }}
          path: dist/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release-draft:
    # Never publish a release from a manual branch build or a partial matrix.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: micromatrix-*
          path: release-assets
          merge-multiple: true
      - name: Create or update a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for sums in SHA256SUMS-*.txt; do sha256sum --check "$sums"; done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets of a published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease \
              --title "MicroMatrix Pi MCP $RELEASE_TAG (test build)" \
              --notes-file ../.github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
