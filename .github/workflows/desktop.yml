name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Validate application and tag versions
        run: node scripts/check-release-version.mjs
      - run: npm run check
      - name: Share the single frontend build with native jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: shared-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are required: a cross-compiled Tauri app must not
          # accidentally embed a SEA built for the runner's different CPU.
          - runner: macos-15
            id: macos-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            id: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-2022
            id: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: ubuntu-22.04
            id: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      MICROMATRIX_BUILD_TARGET: ${{ matrix.target }}
      # Ad-hoc only; these are test packages, not notarized distribution builds.
      APPLE_SIGNING_IDENTITY: '-'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.98.1'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils
      - run: npm ci
      - name: Native-platform regression tests
        run: npm run typecheck && npm test
      - name: Download the verified shared frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8, Node 24
        with:
          name: shared-web
          path: apps/web/dist
      - name: Build and smoke-test native Node SEA
        run: npm run build:sidecar -- --prebuilt-web && npm run smoke:sidecar
      - name: Restore Rust dependencies and compiled crates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, Node 24
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.id }}
          cache-bin: false
          # Default-branch caches are available to later tags; other tags are not.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - name: Build Tauri installers
        id: tauri-build
        run: npm run tauri -- build --ci --config src-tauri/tauri.prebuilt.conf.json --bundles ${{ matrix.bundles }} -- --locked --timings
      - name: Collect installers, standalone service, notices and checksums
        run: node scripts/package-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: micromatrix-${{ matrix.id }}
          path: dist/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Rust compilation timings
        if: always() && steps.tauri-build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: rust-timings-${{ matrix.id }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14

  release-draft:
    # Never publish a release from a manual branch build or a partial matrix.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8, Node 24
        with:
          pattern: micromatrix-*
          path: release-assets
          merge-multiple: true
      - name: Create or update a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for sums in SHA256SUMS-*.txt; do sha256sum --check "$sums"; done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets of a published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease \
              --title "MicroMatrix Pi MCP $RELEASE_TAG (test build)" \
              --notes-file ../.github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
