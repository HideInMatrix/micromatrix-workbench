name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Prepare application version from tag
        run: node scripts/release-version.mjs
      - name: Require updater signing secret before expensive native builds
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY repository Secret; signed updates cannot be released" >&2
            exit 1
          fi
      - name: Require pinned long-lived macOS signing certificate
        if: github.ref_type == 'tag'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_CERTIFICATE_SHA1: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA1 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          node --input-type=module -e 'import { macSigningIdentity } from "./scripts/build-channel.mjs"; macSigningIdentity(); if (!process.env.APPLE_CERTIFICATE) throw new Error("Missing APPLE_CERTIFICATE; refusing another ad-hoc macOS release")'
      - run: npm ci
      - run: npm run check
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify browser configuration, OAuth trust/limits and owned tunnel lifecycle
        run: node scripts/smoke-priority.mjs
      - name: Verify release notice integrity and network diagnostics
        run: node scripts/smoke-release-closeout.mjs
      - name: Verify remote display and ASIL protocol contracts
        run: node scripts/smoke-remote-desktop.mjs
      - name: Bundle the service using the already checked frontend
        run: npm run build:service -- --prebuilt-web
      - name: Install an isolated CI Chromium for real browser acceptance
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify real Vue configuration and headless browser execution
        run: |
          node scripts/smoke-runtime-ui.mjs
          # Actual packaged MCP/browser acceptance is required in every native
          # macOS/Windows job; Ubuntu verifies the shared browser implementation.
          node scripts/smoke-computer-batch.mjs --browser-executable "$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
      - name: Verify OAuth issuer binding and hostile source-map offsets
        run: node scripts/smoke-dependency-security.mjs
      - name: Share the single frontend build with native jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: shared-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are required: a cross-compiled Tauri app must not
          # accidentally embed a SEA built for the runner's different CPU.
          - runner: macos-15
            id: macos-arm64
            target: aarch64-apple-darwin
            # Build/sign .app once; create the DMG separately without Finder.
            bundles: app
          - runner: macos-15-intel
            id: macos-x64
            target: x86_64-apple-darwin
            bundles: app
          - runner: windows-2022
            id: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.runner }}
    env:
      CI: 'true'
      MICROMATRIX_BUILD_TARGET: ${{ matrix.target }}
      # Manual branch builds use an isolated Dev identity. Tag builds must use
      # the same pinned self-signed certificate; never fall back to ad-hoc.
      APPLE_SIGNING_IDENTITY: ${{ github.ref_type == 'tag' && vars.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_SIGNING_CERTIFICATE_SHA1: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA1 }}
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Prepare application version from tag
        run: node scripts/release-version.mjs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.98.1'
      - run: npm ci
      - name: Native-platform typecheck
        run: npm run typecheck
      - name: Verify isolated JavaScript Computer Use batches
        run: node scripts/smoke-computer-batch.mjs
      - name: Verify ported ASIL declarative examples on the native OS
        run: node scripts/smoke-asil.mjs
      - name: Download the verified shared frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8, Node 24
        with:
          name: shared-web
          path: apps/web/dist
      - name: Import pinned certificate into an owned temporary keychain
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: node scripts/import-macos-certificate.mjs import
      - name: Restore Rust dependencies and compiled crates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, Node 24
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.id }}
          cache-bin: false
          # Default-branch caches are available to later tags; other tags are not.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - name: Build and smoke-test native Node SEA
        run: npm run build:sidecar -- --prebuilt-web && npm run smoke:sidecar
      - name: Require complete fixed-version dependency notice files
        run: node scripts/dependency-notices.mjs --strict
      - name: Install an isolated native-runner browser
        run: node node_modules/playwright-core/cli.js install chromium
      - name: Verify packaged browser, native permission and owned process lifecycle
        run: node scripts/smoke-packaged-platform.mjs
      - name: Build Tauri application and native installers
        id: tauri-build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --ci --verbose --config src-tauri/tauri.prebuilt.conf.json --bundles ${{ matrix.bundles }} -- --locked --timings
      - name: Smoke-test the final signed macOS sidecar
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-signing.mjs && node scripts/smoke-sidecar.mjs --bundled
      - name: Create and verify headless macOS DMG
        if: runner.os == 'macOS'
        run: node scripts/package-macos-dmg.mjs
      - name: Collect installers, standalone service, notices and checksums
        run: node scripts/package-artifacts.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: micromatrix-${{ matrix.id }}
          path: dist/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload macOS packaging diagnostics
        if: always() && runner.os == 'macOS' && steps.tauri-build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: packaging-logs-${{ matrix.id }}
          path: src-tauri/target/packaging-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Rust compilation timings
        if: always() && steps.tauri-build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: rust-timings-${{ matrix.id }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove owned Apple signing keychain
        if: always() && runner.os == 'macOS' && github.ref_type == 'tag'
        run: node scripts/import-macos-certificate.mjs cleanup

  release:
    # Never publish a release from a manual branch build or a partial matrix.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8, Node 24
        with:
          pattern: micromatrix-*
          path: build-artifacts
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, Node 24
        with:
          node-version: '22.23.3'
      - name: Verify signed update packages and prepare desktop release
        run: node scripts/prepare-release-assets.mjs
      - name: Upload desktop installers and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          # Normal SemVer tags publish stable/Latest automatically. Keep an
          # explicitly requested -rc/-beta tag out of the stable update channel.
          version=${RELEASE_TAG#v}
          version=${version%%+*}
          prerelease=false
          latest=true
          channel=release
          if [[ "$version" == *-* ]]; then
            prerelease=true
            latest=false
            channel=prerelease
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Refusing to replace assets of a published release" >&2
              exit 1
            fi
            # An old/manual draft may already contain standalone services.
            # Do not silently publish those alongside the desktop whitelist.
            existing_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if [[ "$asset" == */* ]] || [ ! -f "$asset" ]; then
                echo "Draft contains an excluded asset: $asset; remove it or use a new tag" >&2
                exit 1
              fi
            done <<< "$existing_assets"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease="$prerelease" \
              --title "micromatrix agent $RELEASE_TAG" \
              --notes-file ../.github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          # Keep incomplete uploads private. Publish only after every upload
          # succeeds. No manual draft publication is required.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$prerelease" --latest="$latest"
          url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          printf 'Published %s: %s\n' "$channel" "$url"
          printf '### Published %s\n\n[%s](%s)\n' "$channel" "$RELEASE_TAG" "$url" >> "$GITHUB_STEP_SUMMARY"
